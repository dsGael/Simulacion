<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verificador de Precios</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>



    <div class="imagenes-container">
      <img id="imagenIzquierda" src="img/imagenIzquierda.jpg" alt="Imagen Izquierda" >
      <h1 id="currentDate"></h1>
      <h1 id="currentTime"></h1>
      <img id="imagenDerecha" src="img/imagenDerecha.jpg" alt="Imagen Derecha" >
    </div>

    <h1 id="title">Verificador de precios</h1>
    <div id="fileInput-container">
      <label for="fileInput" class="fileInput-label" id="fileInput-label">Selecciona un archivo .csv</label>
      <br><br>
      <input type="file" id="fileInput" class="fileInput" accept=".csv"  />
    </div>

    <div  id="main-container" class="hidden main-container" style="text-align: center; padding: 20px;">
      <h3 id="fileName">Archivo:</h3>
      <h3 id="file"></h3>
      <h2 id="instruction">Presiona el código del producto y luego Enter</h2>
      <h2 id="productTag">Producto:</h2>
      <h2 id="responseName"></h2>
      <h2 id="responsePrice"></h2>

      <img id="imagen" src="img/barcode.gif" alt="Código de barras" style="width: 200px;">
    </div>
     
    <div><div id="language-toggle-container" class="switch-container">
      <label class="switch">
        <input type="checkbox" id="toggleLanguage" onchange="toggleLanguage()">
        <span class="slider"></span>
      </label>
      <span id="languageLabel">ES</span>
    </div>
    <div id="night-mode-container" class="switch-container">
        <label class="switch">
          <input type="checkbox" id="toggleTheme" onchange="toggleTheme()">
          <span class="slider"></span>
        </label>
        <span id="themeLabel"> 🌞</span>
    </div>    
  </div>
    
  <script src="./js/functions.js"></script>
</body>
</html>
